<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Content Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; background: #060d1a; color: #e6e9f0; }
    .header { background: #0f1729; border-bottom: 1px solid #1f2940; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .logout-btn { padding: 8px 16px; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
    .logout-btn:hover { background: #b91c1c; }
    .tabs { background: #0f1729; border-bottom: 1px solid #1f2940; display: flex; gap: 0; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 16px 20px; background: none; border: none; color: #6b7280; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 500; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
    .tab-btn:hover { color: #2563eb; }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: #0f1729; border: 1px solid #1f2940; border-radius: 12px; padding: 20px; }
    .card-title { font-size: 13px; color: #94a0b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .card-value { font-size: 32px; font-weight: 700; color: #2563eb; }
    .form-section { background: #0f1729; border: 1px solid #1f2940; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    .form-section h3 { margin-bottom: 20px; font-size: 18px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: #0f1729; border: 1px solid #1f2940; border-radius: 8px; color: #e6e9f0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .btn { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; transition: all 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #1f2940; color: #e6e9f0; margin-right: 10px; }
    .btn-secondary:hover { background: #2a3a52; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
    .message.success { background: #10b981; color: white; }
    .message.error { background: #dc2626; color: white; }
    .content-block { margin: 20px 0; padding: 20px; background: #1f2940; border-radius: 8px; border-left: 3px solid #2563eb; }
    .content-block h4 { margin-bottom: 12px; color: #2563eb; }
    .content-block p { white-space: pre-wrap; font-size: 13px; line-height: 1.6; margin-bottom: 15px; }
    .hashtags { background: #0f1729; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 12px; color: #2563eb; }
    .button-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .posted-badge { padding: 6px 12px; background: #10b981; color: white; border-radius: 6px; font-size: 12px; font-weight: 600; margin-right: 10px; margin-bottom: 10px; }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #2563eb; border-radius: 50%; border-top-color: transparent; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Content Manager</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('analytics')">📈 Analytics</button>
    <button class="tab-btn" onclick="switchTab('generator')">🤖 Content Generator</button>
    <button class="tab-btn" onclick="switchTab('portfolio')">👤 Portfolio</button>
  </div>

  <div class="container">
    <!-- Analytics Tab -->
    <div id="analytics" class="tab-content active">
      <h2 style="margin-bottom: 30px;">📈 Analytics Dashboard</h2>

      <div class="grid">
        <div class="card">
          <div class="card-title">Content Streak</div>
          <div class="card-value" id="streakValue">0</div>
        </div>
        <div class="card">
          <div class="card-title">Posts This Week</div>
          <div class="card-value" id="weekValue">0</div>
        </div>
        <div class="card">
          <div class="card-title">LinkedIn Followers</div>
          <div class="card-value" id="linkedinValue">—</div>
        </div>
      </div>

      <div class="form-section">
        <h3>Today's Posts</h3>
        <div id="postedToday" style="margin-top: 10px;"></div>
        <div id="noPosts" style="color: #6b7280;">No posts recorded yet.</div>
      </div>

      <div class="form-section">
        <h3>Update Metrics</h3>
        <div class="form-group">
          <label>LinkedIn Followers</label>
          <input type="number" id="linkedinInput" placeholder="Enter count">
        </div>
        <button class="btn" onclick="updateMetrics()">Save</button>
      </div>
    </div>

    <!-- Content Generator Tab -->
    <div id="generator" class="tab-content">
      <h2 style="margin-bottom: 30px;">🤖 Content Generator</h2>

      <div class="form-section">
        <h3>Generate Content</h3>
        <div id="generatorMessage"></div>

        <div class="form-group">
          <label>Topic</label>
          <input type="text" id="topic" placeholder="e.g., QA Testing, AI, Automation">
        </div>

        <div class="form-group">
          <label>Tone</label>
          <select id="tone">
            <option value="professional">Professional</option>
            <option value="casual">Casual</option>
            <option value="educational">Educational</option>
            <option value="technical">Technical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Post Size</label>
          <select id="postSize">
            <option value="short">📱 Short (Quick test)</option>
            <option value="medium" selected>📝 Medium (Normal post)</option>
            <option value="long">📄 Long (Full article)</option>
          </select>
        </div>

        <button class="btn" id="generateBtn" onclick="generateContent()">✨ Generate Content</button>

        <div id="output" style="margin-top: 30px;"></div>
      </div>
    </div>

    <!-- Portfolio Tab -->
    <div id="portfolio" class="tab-content">
      <h2 style="margin-bottom: 30px;">👤 Portfolio Management</h2>

      <div class="form-section">
        <h3>Add Blog Post</h3>
        <div id="blogMessage"></div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="blogTitle" placeholder="Blog title">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="blogContent" placeholder="Blog content"></textarea>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="blogCategory" placeholder="e.g., QA, Testing">
        </div>
        <button class="btn" onclick="addBlog()">Add Blog</button>
      </div>

      <div class="form-section">
        <h3>Add Certification</h3>
        <div id="certMessage"></div>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="certName" placeholder="e.g., ISTQB">
        </div>
        <div class="form-group">
          <label>Year</label>
          <input type="number" id="certYear" placeholder="2024">
        </div>
        <button class="btn" onclick="addCert()">Add Certification</button>
      </div>
    </div>
  </div>

  <script>
    let jwtToken = null;
    const dailyTopics = {
      0: 'Tool review: Testing tools and comparisons',
      1: 'Testing tips: QA best practices',
      2: 'Automation tip: Test automation strategies',
      3: 'AI in testing: How AI helps QA',
      4: 'ISTQB lesson: Certification concepts',
      5: 'Bug story: Real bugs and lessons learned',
      6: 'Career lesson: QA career growth'
    };

    const hashtagMap = {
      0: '#Testing #Tools #QA',
      1: '#QA #Testing #ISTQB',
      2: '#Automation #TestAutomation',
      3: '#AI #Testing #QA',
      4: '#ISTQB #Certification #QA',
      5: '#BugHunting #QA #Testing',
      6: '#QACareer #CareerGrowth'
    };

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      getToken();
      loadDashboard();
      autoPopulateTopic();
    });

    function autoPopulateTopic() {
      const today = new Date().getDay();
      document.getElementById('topic').value = dailyTopics[today];
    }

    function checkAuth() {
      fetch('/admin/api/check-auth').then(r => r.json()).then(d => {
        if (!d.authenticated) window.location.href = '/admin/login.html';
      });
    }

    function getToken() {
      fetch('/admin/api/get-token', { method: 'POST' })
        .then(r => r.json())
        .then(d => { if (d.token) jwtToken = d.token; });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function loadDashboard() {
      const posts = JSON.parse(localStorage.getItem('postsToday') || '{}');
      updateDashboard(posts);
    }

    function updateDashboard(posts) {
      const container = document.getElementById('postedToday');
      const noPosts = document.getElementById('noPosts');

      if (Object.keys(posts).length > 0) {
        container.innerHTML = Object.entries(posts).map(([p, t]) =>
          `<div class="posted-badge">✅ ${p} - ${t}</div>`
        ).join('');
        noPosts.style.display = 'none';
      } else {
        container.innerHTML = '';
        noPosts.style.display = 'block';
      }
    }

    function recordPost(platform) {
      const time = new Date().toLocaleTimeString();
      const posts = JSON.parse(localStorage.getItem('postsToday') || '{}');
      posts[platform] = time;
      localStorage.setItem('postsToday', JSON.stringify(posts));
      updateDashboard(posts);
    }

    function updateMetrics() {
      const linkedin = document.getElementById('linkedinInput').value;
      if (linkedin) {
        localStorage.setItem('linkedinFollowers', linkedin);
        document.getElementById('linkedinValue').textContent = linkedin;
        alert('✅ Metrics updated!');
      }
    }

    async function generateContent() {
      const topic = document.getElementById('topic').value;
      const tone = document.getElementById('tone').value;
      const postSize = document.getElementById('postSize').value;

      if (!topic.trim()) {
        showMessage('generatorMessage', '❌ Please enter a topic', 'error');
        return;
      }

      // Modify topic based on post size
      let finalTopic = topic;
      if (postSize === 'short') {
        finalTopic = `SHORT VERSION (Twitter/LinkedIn comment length, max 280 characters): ${topic}`;
      } else if (postSize === 'long') {
        finalTopic = `LONG VERSION (Detailed article, 800+ words): ${topic}`;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Generating...';

      try {
        const response = await fetch('/api/generate-content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'full', topics: [finalTopic], tone })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showMessage('generatorMessage', `❌ ${data.error || 'Error'}`, 'error');
          return;
        }

        const today = new Date().getDay();
        const hashtags = hashtagMap[today];

        let html = '<h4 style="margin-bottom: 20px;">📄 Generated Content:</h4>';

        const sections = [
          { key: 'linkedin_post', title: '📱 LinkedIn', platform: 'LinkedIn', emoji: '🔗' },
          { key: 'xing_german_post', title: '🇩🇪 XING', platform: 'XING', emoji: '🌍' },
          { key: 'article', title: '📝 Blog Article', platform: 'Blog', emoji: '📰' },
          { key: 'github_ideas', title: '💡 GitHub Ideas', platform: 'GitHub', emoji: '🔧' },
          { key: 'checklist', title: '✅ Checklist', platform: 'Checklist', emoji: '📋' }
        ];

        sections.forEach(section => {
          if (data[section.key]) {
            const text = data[section.key];
            const fullText = section.platform !== 'Blog' ? `${text}\n\n${hashtags}` : text;
            const textForBtn = fullText.replace(/'/g, "\\'").replace(/"/g, '\\"');

            html += `<div class="content-block">
              <h4>${section.emoji} ${section.title}</h4>
              <p>${text}</p>
              <div class="hashtags">${hashtags}</div>
              <div class="button-group">
                <button class="btn btn-secondary" onclick="copyText(\`${fullText.replace(/`/g, '\\`')}\`)">📋 Copy</button>`;

            if (section.platform === 'LinkedIn') {
              html += `<button class="btn btn-success" onclick="postToLinkedIn('${textForBtn}')">📱 Post to LinkedIn</button>
                       <button class="btn btn-secondary" onclick="recordPost('LinkedIn')">✅ Mark Posted</button>`;
            } else if (section.platform === 'XING') {
              html += `<button class="btn btn-success" onclick="postToXing('${textForBtn}')">🇩🇪 Post to XING</button>
                       <button class="btn btn-secondary" onclick="recordPost('XING')">✅ Mark Posted</button>`;
            } else if (section.platform === 'Blog') {
              html += `<button class="btn btn-success" onclick="saveToBlog('${textForBtn}')">💾 Save to Blog</button>
                       <button class="btn btn-secondary" onclick="recordPost('Blog')">✅ Mark Posted</button>`;
            } else {
              html += `<button class="btn btn-secondary" onclick="recordPost('${section.platform}')">✅ Mark Done</button>`;
            }

            html += `</div></div>`;
          }
        });

        document.getElementById('output').innerHTML = html;
        showMessage('generatorMessage', '✅ Content ready! Copy and post to platforms.', 'success');
      } catch (err) {
        showMessage('generatorMessage', `❌ Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '✨ Generate Content';
      }
    }

    function postToLinkedIn(text) {
      navigator.clipboard.writeText(text).then(() => {
        window.open('https://www.linkedin.com/feed/', '_blank');
        alert('✅ Content copied! Paste in LinkedIn and post. Then click "Mark Posted".');
      });
    }

    function postToXing(text) {
      navigator.clipboard.writeText(text).then(() => {
        window.open('https://www.xing.com', '_blank');
        alert('✅ Content copied! Paste in XING and post. Then click "Mark Posted".');
      });
    }

    function saveToBlog(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Content copied! Navigate to your blog to add it. Then click "Mark Posted".');
      });
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Copied to clipboard!');
      });
    }

    function showMessage(el, msg, type) {
      document.getElementById(el).innerHTML = `<div class="message ${type}">${msg}</div>`;
    }

    async function addBlog() {
      alert('✅ Blog added! View at https://iamseraj.com/#blog');
    }

    async function addCert() {
      alert('✅ Certification added!');
    }

    function logout() {
      fetch('/admin/api/logout', { method: 'POST' })
        .then(() => { window.location.href = '/admin/login.html'; });
    }

    // Load saved metrics
    window.addEventListener('DOMContentLoaded', () => {
      const linkedin = localStorage.getItem('linkedinFollowers');
      if (linkedin) document.getElementById('linkedinValue').textContent = linkedin;
    });
  </script>
</body>
</html>
