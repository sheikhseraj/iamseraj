<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Content Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', sans-serif; background: #060d1a; color: #e6e9f0; }
    .header { background: #0f1729; border-bottom: 1px solid #1f2940; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .logout-btn { padding: 8px 16px; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
    .logout-btn:hover { background: #b91c1c; }
    .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    .form-section { background: #0f1729; border: 1px solid #1f2940; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    .form-section h3 { margin-bottom: 20px; font-size: 18px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: #0f1729; border: 1px solid #1f2940; border-radius: 8px; color: #e6e9f0; font-family: 'Space Grotesk', sans-serif; font-size: 14px; }
    .btn { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #1f2940; color: #e6e9f0; margin-right: 10px; }
    .btn-secondary:hover { background: #2a3a52; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
    .message.success { background: #10b981; color: white; }
    .message.error { background: #dc2626; color: white; }
    .content-block { margin: 20px 0; padding: 20px; background: #1f2940; border-radius: 8px; border-left: 3px solid #2563eb; }
    .content-block h4 { margin-bottom: 12px; color: #2563eb; }
    .content-block p { white-space: pre-wrap; font-size: 13px; line-height: 1.6; margin-bottom: 15px; }
    .hashtags { background: #0f1729; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 12px; color: #2563eb; }
    .button-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #2563eb; border-radius: 50%; border-top-color: transparent; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Content Generator</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="form-section">
      <h3>📝 Generate Content</h3>
      <div id="message"></div>

      <div class="form-group">
        <label>Topic</label>
        <input type="text" id="topic" placeholder="Enter your topic" value="QA Testing">
      </div>

      <div class="form-group">
        <label>Tone</label>
        <select id="tone">
          <option value="professional">Professional</option>
          <option value="casual">Casual</option>
          <option value="educational">Educational</option>
          <option value="technical">Technical</option>
        </select>
      </div>

      <button class="btn" id="generateBtn" onclick="generateContent()">✨ Generate Content</button>

      <div id="output" style="margin-top: 30px;"></div>
    </div>
  </div>

  <script>
    let jwtToken = null;

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      getToken();
    });

    function checkAuth() {
      fetch('/admin/api/check-auth')
        .then(r => r.json())
        .then(d => {
          if (!d.authenticated) window.location.href = '/admin/login.html';
        });
    }

    function getToken() {
      fetch('/admin/api/get-token', { method: 'POST' })
        .then(r => r.json())
        .then(d => { if (d.token) jwtToken = d.token; });
    }

    async function generateContent() {
      const topic = document.getElementById('topic').value;
      const tone = document.getElementById('tone').value;

      if (!topic.trim()) {
        showMessage('❌ Please enter a topic', 'error');
        return;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Generating...';

      try {
        const response = await fetch('/api/generate-content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'full',
            topics: [topic],
            tone: tone
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          showMessage(`❌ ${data.error || 'Error generating content'}`, 'error');
          return;
        }

        // Display content
        let html = '<h4 style="margin-bottom: 20px;">📄 Generated Content:</h4>';

        const sections = [
          { key: 'linkedin_post', title: '📱 LinkedIn Post', icon: '🔗' },
          { key: 'article', title: '📰 Article', icon: '📝' },
          { key: 'xing_german_post', title: '🇩🇪 XING Post', icon: '🌍' },
          { key: 'github_ideas', title: '💡 GitHub Ideas', icon: '🔧' },
          { key: 'checklist', title: '✅ Checklist', icon: '📋' }
        ];

        sections.forEach(section => {
          if (data[section.key]) {
            html += `
              <div class="content-block">
                <h4>${section.icon} ${section.title}</h4>
                <p>${data[section.key]}</p>
                <button class="btn btn-secondary" onclick="copyText(\`${data[section.key].replace(/`/g, '\\`')}\`)">📋 Copy</button>
              </div>
            `;
          }
        });

        document.getElementById('output').innerHTML = html;
        showMessage('✅ Content generated! Copy and use.', 'success');
      } catch (err) {
        showMessage(`❌ Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '✨ Generate Content';
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Copied!');
      });
    }

    function showMessage(msg, type) {
      const el = document.getElementById('message');
      el.innerHTML = `<div class="message ${type}">${msg}</div>`;
    }

    function logout() {
      fetch('/admin/api/logout', { method: 'POST' })
        .then(() => { window.location.href = '/admin/login.html'; });
    }
  </script>
</body>
</html>
