<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/portfolio-theme.css">
  <script src="/portfolio-theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Seraj</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-elev) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-box {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-text));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      font-size: 14px;
      color: var(--text-dim);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .error {
      display: none;
      background: var(--danger-surface);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="admin-theme-actions"><button type="button" class="site-theme-toggle" data-theme-toggle>
        <span class="theme-for-dark"><span aria-hidden="true">☀</span><span class="theme-label">Switch to light mode</span></span>
        <span class="theme-for-light"><span aria-hidden="true">☾</span><span class="theme-label">Switch to dark mode</span></span>
      </button></div>
      <div class="logo">
        <h1>Seraj Admin</h1>
        <p>Content & Analytics Hub</p>
      </div>

      <div class="error" id="error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="password">Admin Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" id="loginBtn">Sign In</button>

        <div class="loading" id="loading">
          <span class="spinner"></span>
          <span>Authenticating...</span>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const loadingEl = document.getElementById('loading');
      const loginBtn = document.getElementById('loginBtn');

      errorEl.classList.remove('show');
      loadingEl.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const response = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/admin/dashboard.html';
        } else {
          errorEl.textContent = data.error || 'Invalid password';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = 'Connection error. Try again.';
        errorEl.classList.add('show');
      } finally {
        loadingEl.style.display = 'none';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
